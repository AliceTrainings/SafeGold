<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Gold Palace</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="container my-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                <li class="breadcrumb-item active">Products</li>
            </ol>
        </nav>

        <div class="row">
            <!-- Filters Sidebar -->
            <div class="col-lg-3 mb-4">
                <div th:replace="~{fragments/product-filters :: product-filters}"></div>
            </div>

            <!-- Products Grid -->
            <div class="col-lg-9">
                <!-- Results Header -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">
                        Products 
                        <small class="text-muted">(<span th:text="${products.totalElements}"></span> items found)</small>
                    </h4>
                    
                    <!-- Sort Options -->
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="fas fa-sort me-1"></i>Sort By
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="?sortBy=name&sortDir=asc">Name (A-Z)</a></li>
                            <li><a class="dropdown-item" href="?sortBy=name&sortDir=desc">Name (Z-A)</a></li>
                            <li><a class="dropdown-item" href="?sortBy=price&sortDir=asc">Price (Low to High)</a></li>
                            <li><a class="dropdown-item" href="?sortBy=price&sortDir=desc">Price (High to Low)</a></li>
                            <li><a class="dropdown-item" href="?sortBy=createdAt&sortDir=desc">Newest First</a></li>
                        </ul>
                    </div>
                </div>

                <!-- Active Filters -->
                <div class="mb-3" th:if="${currentFilters?.searchTerm or currentFilters?.categoryId or currentFilters?.karat or currentFilters?.minPrice or currentFilters?.maxPrice}">
                    <div class="d-flex flex-wrap align-items-center">
                        <span class="me-2">Active filters:</span>
                        <span class="badge bg-primary me-1" th:if="${currentFilters?.searchTerm}">
                            Search: <span th:text="${currentFilters.searchTerm}"></span>
                        </span>
                        <span class="badge bg-primary me-1" th:if="${currentFilters?.categoryId}">
                            Category: <span th:text="${categories.?[id == currentFilters.categoryId].get(0).name}"></span>
                        </span>
                        <span class="badge bg-primary me-1" th:if="${currentFilters?.karat}">
                            Karat: <span th:text="${currentFilters.karat}"></span>
                        </span>
                        <span class="badge bg-primary me-1" th:if="${currentFilters?.minPrice}">
                            Min: ₹<span th:text="${currentFilters.minPrice}"></span>
                        </span>
                        <span class="badge bg-primary me-1" th:if="${currentFilters?.maxPrice}">
                            Max: ₹<span th:text="${currentFilters.maxPrice}"></span>
                        </span>
                    </div>
                </div>

                <!-- Products Grid -->
                <div th:replace="~{fragments/product-cards :: product-cards}"></div>

                <!-- Pagination -->
                <nav th:if="${products.totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:class="${products.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${products.number - 1}, size=${products.size})}">Previous</a>
                        </li>
                        
                        <li class="page-item" th:each="page : ${#numbers.sequence(0, products.totalPages - 1)}"
                            th:class="${page == products.number} ? 'active'">
                            <a class="page-link" th:href="@{/products(page=${page}, size=${products.size})}" 
                               th:text="${page + 1}"></a>
                        </li>
                        
                        <li class="page-item" th:class="${products.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${products.number + 1}, size=${products.size})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/products.js}"></script>
</body>
</html>
