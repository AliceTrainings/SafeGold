<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <title>My Watchlist - Gold Sales</title>
</head>
<body>
    <div th:fragment="content">
        <div class="container my-4">
            <!-- Flash Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${successMessage}">Success message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${errorMessage}">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2><i class="fas fa-heart text-warning me-2"></i>My Watchlist</h2>
                    <p class="text-muted">Products you're interested in</p>
                </div>
                <a href="/user/dashboard" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left me-2"></i>Browse Products
                </a>
            </div>

            <!-- Watchlist Items -->
            <div class="row" th:if="${watchlist != null and !watchlist.isEmpty()}">
                <div class="col-lg-4 col-md-6 mb-4" th:each="product : ${watchlist}">
                    <div class="card product-card h-100">
                        <img th:src="${product.imageUrl}" th:alt="${product.name}" class="card-img-top product-image">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                            <div class="mb-2">
                                <span class="badge karat-badge me-2" th:text="${product.karat + 'K'}">18K</span>
                                <span class="badge category-badge text-white" th:text="${product.category.displayName}">Ring</span>
                            </div>
                            <p class="card-text">
                                <strong>Weight:</strong> <span th:text="${product.grams}">5.5</span>g<br>
                                <strong>Rate:</strong> ₹<span th:text="${#numbers.formatDecimal(product.rate, 0, 2)}">4500.00</span><br>
                                <strong>Total Value:</strong> ₹<span th:text="${#numbers.formatDecimal(product.totalValue, 0, 2)}">24750.00</span>
                            </p>
                            <div class="mt-auto">
                                <div class="btn-group w-100" role="group">
                                    <a th:href="@{/user/product/{id}(id=${product.id})}" class="btn btn-gold">
                                        <i class="fas fa-eye me-1"></i>Details
                                    </a>
                                    <form th:action="@{/user/watchlist/remove/{productId}(productId=${product.id})}" method="post" class="flex-fill">
                                        <button type="submit" class="btn btn-outline-danger w-100" title="Remove from Watchlist"
                                                onclick="return confirm('Remove this item from your watchlist?')">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty Watchlist Message -->
            <div class="text-center py-5" th:if="${watchlist == null or watchlist.isEmpty()}">
                <i class="fas fa-heart fa-4x text-muted mb-3"></i>
                <h4 class="text-muted">Your Watchlist is Empty</h4>
                <p class="text-muted">Start adding products you're interested in to keep track of them.</p>
                <a href="/user/dashboard" class="btn btn-gold">
                    <i class="fas fa-gem me-2"></i>Browse Products
                </a>
            </div>
        </div>
    </div>
</body>
</html>
