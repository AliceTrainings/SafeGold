<div th:fragment="product-filters" class="card shadow-sm">
    <div class="card-header bg-primary text-white">
        <h6 class="mb-0">
            <i class="fas fa-filter me-2"></i>Filter Products
        </h6>
    </div>
    <div class="card-body">
        <form th:action="@{/products}" method="get" id="filterForm">
            <!-- Search -->
            <div class="mb-3">
                <label for="search" class="form-label">Search</label>
                <input type="text" class="form-control" id="search" name="search" 
                       th:value="${currentFilters?.searchTerm}" placeholder="Product name...">
            </div>

            <!-- Category Filter -->
            <div class="mb-3">
                <label for="categoryId" class="form-label">Category</label>
                <select class="form-select" id="categoryId" name="categoryId">
                    <option value="">All Categories</option>
                    <option th:each="category : ${categories}" 
                            th:value="${category.id}" 
                            th:text="${category.name}"
                            th:selected="${currentFilters?.categoryId == category.id}"></option>
                </select>
            </div>

            <!-- Karat Filter -->
            <div class="mb-3">
                <label for="karat" class="form-label">Karat</label>
                <select class="form-select" id="karat" name="karat">
                    <option value="">All Karats</option>
                    <option th:each="karatValue : ${karatValues}" 
                            th:value="${karatValue.name()}" 
                            th:text="${karatValue.display}"
                            th:selected="${currentFilters?.karat == karatValue.name()}"></option>
                </select>
            </div>

            <!-- Price Range -->
            <div class="mb-3">
                <label class="form-label">Price Range (₹)</label>
                <div class="row">
                    <div class="col-6">
                        <input type="number" class="form-control" name="minPrice" 
                               placeholder="Min" th:value="${currentFilters?.minPrice}">
                    </div>
                    <div class="col-6">
                        <input type="number" class="form-control" name="maxPrice" 
                               placeholder="Max" th:value="${currentFilters?.maxPrice}">
                    </div>
                </div>
            </div>

            <!-- Filter Actions -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-search me-1"></i>Apply Filters
                </button>
                <a th:href="@{/products}" class="btn btn-outline-secondary">
                    <i class="fas fa-times me-1"></i>Clear All
                </a>
            </div>
        </form>
    </div>
</div>
