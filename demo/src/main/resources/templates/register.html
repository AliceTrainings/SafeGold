<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Gold Palace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .register-container { 
            min-height: 100vh; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 0;
        }
        .register-card { 
            backdrop-filter: blur(10px); 
            background: rgba(255, 255, 255, 0.98);
            border-radius: 15px;
        }
        .form-control:focus { 
            border-color: #667eea; 
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25); 
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="register-container d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="register-card card shadow-lg border-0">
                        <div class="card-body p-5">
                            <!-- Logo & Title -->
                            <div class="text-center mb-4">
                                <div class="mb-3">
                                    <i class="fas fa-crown fa-3x text-warning"></i>
                                </div>
                                <h3 class="text-primary fw-bold mb-2">Create Your Account</h3>
                                <p class="text-muted">Join Gold Palace - Premium Jewellery & Loans</p>
                            </div>

                            <!-- Error Message -->
                            <div class="alert alert-danger alert-dismissible fade show" th:if="${error}" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <span th:text="${error}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>

                            <!-- Success Message -->
                            <div class="alert alert-success alert-dismissible fade show" th:if="${success}" role="alert">
                                <i class="fas fa-check-circle me-2"></i>
                                <span th:text="${success}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>

                            <!-- Registration Form -->
                            <form th:action="@{/register}" method="post" th:object="${user}">
                                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

                                <!-- Full Name -->
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">
                                        <i class="fas fa-user me-1"></i>Full Name *
                                    </label>
                                    <input type="text" class="form-control form-control-lg" id="fullName" 
                                           th:field="*{fullName}" required 
                                           placeholder="Enter your full name">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" 
                                         th:errors="*{fullName}"></div>
                                </div>

                                <!-- Username -->
                                <div class="mb-3">
                                    <label for="username" class="form-label">
                                        <i class="fas fa-at me-1"></i>Username *
                                    </label>
                                    <input type="text" class="form-control form-control-lg" id="username" 
                                           th:field="*{username}" required 
                                           placeholder="Choose a username">
                                    <small class="form-text text-muted">
                                        Username must be 3-50 characters
                                    </small>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" 
                                         th:errors="*{username}"></div>
                                </div>

                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        <i class="fas fa-envelope me-1"></i>Email Address *
                                    </label>
                                    <input type="email" class="form-control form-control-lg" id="email" 
                                           th:field="*{email}" required 
                                           placeholder="your.email@example.com">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" 
                                         th:errors="*{email}"></div>
                                </div>

                                <!-- Phone Number -->
                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label">
                                        <i class="fas fa-phone me-1"></i>Phone Number *
                                    </label>
                                    <input type="tel" class="form-control form-control-lg" id="phoneNumber" 
                                           th:field="*{phoneNumber}" required 
                                           placeholder="+91 9876543210">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" 
                                         th:errors="*{phoneNumber}"></div>
                                </div>

                                <!-- Password -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        <i class="fas fa-lock me-1"></i>Password *
                                    </label>
                                    <div class="position-relative">
                                        <input type="password" class="form-control form-control-lg" id="password" 
                                               th:field="*{password}" required 
                                               placeholder="Create a strong password">
                                        <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y" 
                                                onclick="togglePassword('password')">
                                            <i class="fas fa-eye" id="passwordIcon"></i>
                                        </button>
                                    </div>
                                    <div class="password-strength mt-2 bg-light" id="passwordStrength"></div>
                                    <small class="form-text text-muted">
                                        Password must be at least 6 characters
                                    </small>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" 
                                         th:errors="*{password}"></div>
                                </div>

                                <!-- Confirm Password -->
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">
                                        <i class="fas fa-lock me-1"></i>Confirm Password *
                                    </label>
                                    <input type="password" class="form-control form-control-lg" id="confirmPassword" 
                                           required placeholder="Re-enter your password">
                                </div>

                                <!-- Address -->
                                <div class="mb-3">
                                    <label for="address" class="form-label">
                                        <i class="fas fa-map-marker-alt me-1"></i>Address
                                    </label>
                                    <textarea class="form-control" id="address" th:field="*{address}" 
                                              rows="2" placeholder="Enter your address (optional)"></textarea>
                                </div>

                                <!-- Terms & Conditions -->
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="terms" required>
                                    <label class="form-check-label" for="terms">
                                        I agree to the <a href="/terms" target="_blank">Terms & Conditions</a> 
                                        and <a href="/privacy" target="_blank">Privacy Policy</a>
                                    </label>
                                </div>

                                <!-- Submit Button -->
                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn btn-primary btn-lg">
                                        <i class="fas fa-user-plus me-2"></i>Create Account
                                    </button>
                                </div>

                                <!-- Login Link -->
                                <div class="text-center">
                                    <p class="text-muted mb-0">
                                        Already have an account? 
                                        <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">
                                            Login here
                                        </a>
                                    </p>
                                </div>
                            </form>

                            <!-- Divider -->
                            <div class="text-center my-4">
                                <div class="d-flex align-items-center">
                                    <hr class="flex-grow-1">
                                    <span class="px-3 text-muted small">OR</span>
                                    <hr class="flex-grow-1">
                                </div>
                            </div>

                            <!-- Back to Home -->
                            <div class="text-center">
                                <a th:href="@{/}" class="text-decoration-none text-muted">
                                    <i class="fas fa-home me-1"></i>Back to Home
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(fieldId + 'Icon');
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                field.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('passwordStrength');
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            const colors = ['#dc3545', '#ffc107', '#17a2b8', '#28a745'];
            const widths = ['25%', '50%', '75%', '100%'];
            
            if (strength > 0) {
                strengthBar.style.width = widths[strength - 1];
                strengthBar.style.backgroundColor = colors[strength - 1];
            } else {
                strengthBar.style.width = '0';
            }
        });

        // Confirm password validation
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (password !== confirmPassword) {
                this.setCustomValidity('Passwords do not match');
                this.classList.add('is-invalid');
            } else {
                this.setCustomValidity('');
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
            }
        });

        // Form validation
        (function () {
            'use strict'
            const forms = document.querySelectorAll('form')
            Array.from(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
