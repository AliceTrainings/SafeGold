spring.application.name=safegold1
spring.datasource.url=jdbc:mysql://localhost:3306/goldloan
spring.datasource.username=root
spring.datasource.password=Dasari@$1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
server.port=8080

# Static resource configuration
spring.web.resources.static-locations=classpath:/static/,file:src/main/resources/static/
spring.mvc.static-path-pattern=/**
spring.web.resources.cache.cachecontrol.max-age=3600

# Security configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.persistent=true