<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Add Product</h3>
    <a class="btn btn-secondary" th:href="@{/admin/products}">Back</a>
  </div>
  <div class="card shadow-sm p-4">
    <form th:action="${product != null and product.id != null} ? @{'/admin/products/' + ${product.id}} : @{/admin/products}" method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Item Name</label>
          <input type="text" name="name" class="form-control" th:value="${product?.name}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <input type="text" name="category" class="form-control" th:value="${product?.category}" placeholder="Ring, Necklace, etc" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Grams</label>
          <input type="number" step="0.01" name="grams" class="form-control" th:value="${product?.grams}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Carats</label>
          <input type="number" name="carats" class="form-control" th:value="${product?.carats}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Image URL</label>
          <input type="text" name="imageUrl" class="form-control" placeholder="/images/ring1.webp" th:value="${product?.imageUrl}" required>
        </div>
        <div class="col-md-12">
          <label class="form-label">Gallery (comma-separated URLs)</label>
          <input type="text" name="gallery" class="form-control" th:value="${product?.gallery}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Price (₹)</label>
          <input type="number" step="0.01" name="price" class="form-control" th:value="${product?.price}" required>
        </div>
        <div class="col-md-8">
          <label class="form-label">Tags (comma-separated)</label>
          <input type="text" name="tags" class="form-control" th:value="${product?.tags}">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" name="description" rows="3" th:text="${product?.description}"></textarea>
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
  </div>
</body>
</html>
