<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Loan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Create Gold Loan</h3>
    <a class="btn btn-secondary" th:href="@{/admin/loans}">Back</a>
  </div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div class="card shadow-sm p-4">
    <form th:action="@{/admin/loans}" method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">User Email</label>
          <input class="form-control" name="userEmail" placeholder="user@example.com">
        </div>
        <div class="col-md-6">
          <label class="form-label">User Mobile</label>
          <input class="form-control" name="userMobile" placeholder="9999999999">
        </div>
        <div class="col-md-4">
          <label class="form-label">Amount (₹)</label>
          <input type="number" step="0.01" class="form-control" name="amount" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Interest Rate (%)</label>
          <input type="number" step="0.01" class="form-control" name="interestRate" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Tenure (months)</label>
          <input type="number" class="form-control" name="tenure" required>
        </div>
        <div class="col-12">
          <label class="form-label">Gold Details</label>
          <textarea class="form-control" name="goldDescription" rows="3" placeholder="Necklace 30g, 22K, etc." required></textarea>
        </div>
        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select class="form-select" name="status">
            <option value="Active">Active</option>
            <option value="Closed">Closed</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Start Date</label>
          <input class="form-control" type="date" name="startDate" th:value="${today}">
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Create Loan</button>
      </div>
    </form>
  </div>
  </div>
</body>
</html>
