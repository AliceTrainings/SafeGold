<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Receipt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<div class="card p-4 shadow">
    <h2 class="text-center mb-4">Payment Receipt</h2>

    <div class="mb-3">
        <strong>User:</strong> <span th:text="${user.name}">User Name</span><br>
        <strong>Email:</strong> <span th:text="${user.email}">user@example.com</span>
    </div>

    <div class="mb-3">
        <strong>Loan Details:</strong><br>
        Loan ID: <span th:text="${loan.id}"></span><br>
        Amount: <span th:text="${loan.amount}"></span><br>
        Gold Description: <span th:text="${loan.goldDescription}"></span><br>
        Interest Rate: <span th:text="${loan.interestRate}"></span>%<br>
        Tenure: <span th:text="${loan.tenure}"></span> months<br>
        Status: <span th:text="${loan.status}"></span>
    </div>

    <div class="mb-3">
        <strong>Payment Details:</strong><br>
        Payment ID: <span th:text="${payment.id}"></span><br>
        Amount Paid: <span th:text="${payment.amount}"></span><br>
        Remaining Amount: <span th:text="${payment.remaining}"></span><br>
        Status: <span th:text="${payment.status}"></span><br>
        Date: <span th:text="${payment.date}"></span>
    </div>

    <div class="text-center mt-4">
        <button class="btn btn-primary" onclick="window.print()">Print Receipt</button>
        <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
