<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">SafeGold Admin</a>
    <div class="d-flex">
      <a class="btn btn-outline-light me-2" th:href="@{/admin/dashboard}">Dashboard</a>
      <a class="btn btn-primary" th:href="@{/admin/products/new}">Add Product</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h3 class="mb-3">Products</h3>
  <div class="row row-cols-1 row-cols-md-3 g-3">
    <div class="col" th:each="p : ${products}">
      <div class="card h-100">
        <img th:src="${p.imageUrl}" class="card-img-top" alt="product">
        <div class="card-body">
          <h5 class="card-title" th:text="${p.name}">Item Name</h5>
          <p class="card-text mb-1">Category: <span th:text="${p.category}">Ring</span></p>
          <p class="card-text mb-1">Grams: <span th:text="${p.grams}">0</span></p>
          <p class="card-text mb-1">Karat: <span th:text="${p.carats}">0</span>K</p>
          <p class="card-text fw-semibold">Price: ₹<span th:text="${p.price}">0</span></p>
        </div>
        <div class="card-footer d-flex gap-2">
          <a class="btn btn-outline-primary btn-sm" th:href="@{'/admin/products/' + ${p.id} + '/edit'}">Edit</a>
          <form th:action="@{'/admin/products/' + ${p.id} + '/delete'}" method="post">
            <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
