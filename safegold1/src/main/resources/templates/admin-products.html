<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Products - D.S.R Gold Loan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';}</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#"><i class="bi bi-gem me-2"></i>D.S.R Admin</a>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-light" th:href="@{/admin/dashboard}">
        <i class="bi bi-speedometer2 me-1"></i>Dashboard
      </a>
      <a class="btn btn-primary" th:href="@{/admin/products/new}">
        <i class="bi bi-plus-circle me-1"></i>Add Product
      </a>
      <a class="btn btn-outline-light" th:href="@{/admin/logout}">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3><i class="bi bi-box-seam me-2"></i>Product Management</h3>
      <p class="text-muted mb-0">Manage your jewelry inventory</p>
    </div>
    <div>
      <span class="badge bg-primary fs-6" th:text="${products.size()} + ' Products'">0 Products</span>
    </div>
  </div>

  <!-- Success/Error Messages -->
  <div th:if="${param.success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i>
    <span th:text="${param.success[0]}">Success message</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <!-- Products Grid -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" th:if="${products != null and !products.isEmpty()}">
    <div class="col" th:each="p : ${products}">
      <div class="card h-100 shadow-sm">
        <div class="position-relative">
          <a th:href="@{'/users/products/' + ${p.id}}" class="d-block" target="_blank">
            <img th:src="${p.imageUrl}" class="card-img-top" style="height: 250px; object-fit: cover; cursor: pointer;" alt="Product Image">
          </a>
          <div class="position-absolute top-0 end-0 p-2">
            <span class="badge bg-success" th:text="${p.category}">Category</span>
          </div>
        </div>
        <div class="card-body d-flex flex-column">
          <h6 class="card-title" th:text="${p.name}">Item Name</h6>
          <div class="mb-2">
            <small class="text-muted">
              <i class="bi bi-scale me-1"></i><span th:text="${p.grams}">0</span>g • 
              <i class="bi bi-gem me-1"></i><span th:text="${p.carats}">0</span>K
            </small>
          </div>
          <p class="card-text text-truncate" th:text="${p.description}" style="font-size: 0.9rem; flex-grow: 1;">Description</p>
          <div class="mt-auto">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="text-success mb-0">₹<span th:text="${p.price}">0</span></h5>
              <small class="text-muted" th:if="${p.tags != null and !p.tags.isEmpty()}">
                <i class="bi bi-tags me-1"></i><span th:text="${#strings.substring(p.tags, 0, 20)} + '...'">Tags</span>
              </small>
            </div>
            <div class="d-flex gap-2">
              <a class="btn btn-outline-primary btn-sm flex-fill" th:href="@{'/admin/products/' + ${p.id} + '/edit'}">
                <i class="bi bi-pencil me-1"></i>Edit
              </a>
              <form th:action="@{'/admin/products/' + ${p.id} + '/delete'}" method="post" class="flex-fill">
                <button class="btn btn-outline-danger btn-sm w-100" type="submit" 
                        onclick="return confirm('Are you sure you want to delete this product? This action cannot be undone.')">
                  <i class="bi bi-trash me-1"></i>Delete
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div th:if="${products == null or products.isEmpty()}" class="text-center py-5">
    <div class="mb-4">
      <i class="bi bi-box-seam text-muted" style="font-size: 4rem;"></i>
    </div>
    <h4 class="text-muted">No products found</h4>
    <p class="text-muted mb-4">Start building your jewelry collection by adding your first product!</p>
    <a th:href="@{/admin/products/new}" class="btn btn-primary">
      <i class="bi bi-plus-circle me-1"></i>Add Your First Product
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
