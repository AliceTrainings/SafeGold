<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product.name}">Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container py-4">
  <div class="row g-4">
    <div class="col-md-6">
      <div id="carouselImages" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="d-block w-100" th:src="${product.imageUrl}" alt="image">
          </div>
          <div class="carousel-item" th:each="img : ${#strings.arraySplit(product.gallery, ',')}">
            <img class="d-block w-100" th:src="${img}" alt="image">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselImages" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselImages" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
    <div class="col-md-6">
      <h3 th:text="${product.name}">Name</h3>
      <p class="mb-1">Category: <span th:text="${product.category}">Ring</span></p>
      <p class="mb-1">Weight: <span th:text="${product.grams}">0</span> g</p>
      <p class="mb-1">Karat: <span th:text="${product.carats}">0</span>K</p>
      <h4 class="text-success">₹ <span th:text="${product.price}">0</span></h4>
      <p class="mt-3" th:text="${product.description}">Description</p>

      <div class="d-flex gap-2">
        <form th:action="@{'/users/watchlist/' + ${product.id} + '/add'}" method="post">
          <button class="btn btn-outline-secondary" type="submit">Add to Watchlist</button>
        </form>
        <form th:action="@{'/users/watchlist/' + ${product.id} + '/remove'}" method="post">
          <button class="btn btn-outline-danger" type="submit">Remove</button>
        </form>
      </div>

      <form th:action="@{'/users/products/' + ${product.id} + '/inquire'}" method="post" class="mt-4">
        <h5>Inquiry</h5>
        <div class="row g-2">
          <div class="col-md-4"><input class="form-control" name="name" placeholder="Your name" required></div>
          <div class="col-md-4"><input class="form-control" type="email" name="email" placeholder="Email"></div>
          <div class="col-md-4"><input class="form-control" name="phone" placeholder="Phone" required></div>
          <div class="col-12"><textarea class="form-control" name="message" rows="3" placeholder="Your message"></textarea></div>
          <div class="col-12"><button class="btn btn-primary mt-2" type="submit">Send Inquiry</button></div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
