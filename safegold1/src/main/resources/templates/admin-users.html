<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/admin-style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="/static/images/logo.png" alt="SafeGold" height="30" class="me-2">
      SafeGold Admin
    </a>
    <div class="d-flex">
      <a class="btn btn-outline-light me-2" th:href="@{/admin/dashboard}">
        <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
      </a>
      <a class="btn btn-outline-light" th:href="@{/admin/logout}">
        <i class="fas fa-sign-out-alt me-1"></i>Logout
      </a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">
      <i class="fas fa-users me-2 text-primary"></i>
      User Management
    </h3>
    <div class="text-muted">
      <i class="fas fa-calendar-alt me-1"></i>
      <span th:text="${#temporals.format(#temporals.createNow(), 'dd MMM yyyy')}">Today</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">
        <i class="fas fa-list me-2"></i>All Users
        <span class="badge bg-primary ms-2" th:text="${users.size()}">0</span>
      </h5>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table admin-table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th><i class="fas fa-hashtag me-1"></i>ID</th>
              <th><i class="fas fa-user me-1"></i>Name</th>
              <th><i class="fas fa-envelope me-1"></i>Email</th>
              <th><i class="fas fa-phone me-1"></i>Mobile</th>
              <th><i class="fas fa-user-tag me-1"></i>Role</th>
              <th><i class="fas fa-money-bill-wave me-1"></i>Active Loans</th>
              <th><i class="fas fa-calendar me-1"></i>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="user : ${users}" th:onclick="'window.location.href=\'/admin/users/\' + ${user.id}'" style="cursor: pointer;">
              <td th:text="${user.id}"></td>
              <td>
                <div class="d-flex align-items-center">
                  <div class="avatar-sm bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2">
                    <i class="fas fa-user"></i>
                  </div>
                  <span th:text="${user.name}"></span>
                </div>
              </td>
              <td th:text="${user.email}"></td>
              <td th:text="${user.mobileNumber ?: 'N/A'}"></td>
              <td>
                <span class="badge" th:classappend="${user.role == 'ADMIN' ? 'bg-danger' : 'bg-success'}" 
                      th:text="${user.role}"></span>
              </td>
              <td>
                <span class="badge bg-warning" th:text="${user.loans.size()}">0</span>
              </td>
              <td>
                <a th:href="@{'/admin/users/' + ${user.id}}" class="btn btn-sm btn-outline-primary">
                  <i class="fas fa-eye me-1"></i>View Details
                </a>
              </td>
            </tr>
            <tr th:if="${users.isEmpty()}">
              <td colspan="7" class="text-center text-muted py-4">
                <i class="fas fa-users fa-2x mb-2 d-block"></i>
                No users found
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Add click animation to table rows
document.addEventListener('DOMContentLoaded', function() {
    const rows = document.querySelectorAll('tbody tr[onclick]');
    rows.forEach(row => {
        row.addEventListener('click', function() {
            this.style.transform = 'scale(0.98)';
            setTimeout(() => {
                this.style.transform = '';
            }, 150);
        });
    });
});
</script>

</body>
</html>
