<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Inquiries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/admin-style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="/static/images/logo.png" alt="SafeGold" height="30" class="me-2">
      SafeGold Admin
    </a>
    <div class="d-flex">
      <a class="btn btn-outline-light me-2" th:href="@{/admin/dashboard}">
        <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
      </a>
      <a class="btn btn-outline-light" th:href="@{/admin/logout}">
        <i class="fas fa-sign-out-alt me-1"></i>Logout
      </a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">
      <i class="fas fa-comments me-2 text-warning"></i>
      Product Inquiries
    </h3>
    <div class="text-muted">
      <i class="fas fa-calendar-alt me-1"></i>
      <span th:text="${#temporals.format(#temporals.createNow(), 'dd MMM yyyy')}">Today</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">
        <i class="fas fa-list me-2"></i>All Inquiries
        <span class="badge bg-warning ms-2" th:text="${inquiries.size()}">0</span>
      </h5>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table admin-table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th><i class="fas fa-hashtag me-1"></i>ID</th>
              <th><i class="fas fa-calendar me-1"></i>Date</th>
              <th><i class="fas fa-box me-1"></i>Product</th>
              <th><i class="fas fa-user me-1"></i>Name</th>
              <th><i class="fas fa-phone me-1"></i>Phone</th>
              <th><i class="fas fa-envelope me-1"></i>Email</th>
              <th><i class="fas fa-comment me-1"></i>Message</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="inq : ${inquiries}">
              <td th:text="${inq.id}"></td>
              <td th:text="${#temporals.format(inq.createdAt, 'dd MMM yyyy')}"></td>
              <td>
                <span class="badge bg-info" th:text="${inq.product != null ? inq.product.name : 'N/A'}"></span>
              </td>
              <td th:text="${inq.name}"></td>
              <td th:text="${inq.phone}"></td>
              <td th:text="${inq.email}"></td>
              <td>
                <span th:text="${inq.message}" class="text-truncate d-inline-block" style="max-width: 200px;" 
                      th:title="${inq.message}"></span>
              </td>
            </tr>
            <tr th:if="${inquiries.isEmpty()}">
              <td colspan="7" class="text-center text-muted py-4">
                <i class="fas fa-comments fa-2x mb-2 d-block"></i>
                No inquiries found
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
