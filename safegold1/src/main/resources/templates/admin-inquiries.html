<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inquiries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Product Inquiries</h3>
    <a class="btn btn-secondary" th:href="@{/admin/dashboard}">Back</a>
  </div>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Product</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Message</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="inq : ${inquiries}">
        <td th:text="${inq.id}"></td>
        <td th:text="${inq.createdAt}"></td>
        <td><span th:text="${inq.product.name}"></span></td>
        <td th:text="${inq.name}"></td>
        <td th:text="${inq.phone}"></td>
        <td th:text="${inq.email}"></td>
        <td th:text="${inq.message}"></td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
