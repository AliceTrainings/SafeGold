<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">SafeGold Admin</a>
    <div class="d-flex">
      <a class="btn btn-outline-light" th:href="@{/admin/logout}">Logout</a>
    </div>
  </div>
  </nav>

<div class="container py-4">
  <h3 class="mb-4">Welcome, <span th:text="${admin.name}">Admin</span></h3>

  <div class="row g-3">
    <div class="col-md-4">
      <div class="card shadow-sm p-3">
        <h5>Total Users</h5>
        <p class="display-6" th:text="${totalUsers}">0</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm p-3">
        <h5>Active Loans</h5>
        <p class="display-6" th:text="${activeLoans}">0</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm p-3">
        <h5>Closed Loans</h5>
        <p class="display-6" th:text="${closedLoans}">0</p>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <a class="btn btn-primary me-2" th:href="@{/admin/products}">Manage Products</a>
    <a class="btn btn-secondary" th:href="@{/users/products}">View Products (User)</a>
    <a class="btn btn-outline-dark ms-2" th:href="@{/admin/inquiries}">View Inquiries</a>
    <a class="btn btn-warning ms-2" th:href="@{/admin/loans}">Manage Loans</a>
  </div>
</div>

</body>
</html>
