<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today Gold Rates</title>
  
  <!-- Bootstrap CSS for quick layout -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f9fa;
    }

    /* Header container */
    .rates-header {
      background-color: #343a40;
      color: #fff;
      padding: 1rem;
      overflow: hidden;
      position: relative;
      height: 60px;
      display: flex;
      align-items: center;
    }

    /* Scrolling ticker */
    .ticker {
      display: flex;
      animation: scroll-left 15s linear infinite;
      white-space: nowrap;
      gap: 3rem;
    }

    .ticker-item {
      display: flex;
      align-items: center;
      font-weight: 600;
      font-size: 1rem;
      gap: 0.5rem;
      transition: transform 0.5s ease;
    }

    .ticker-item:hover {
      transform: scale(1.1);
      color: #FFC107;
    }

    @keyframes scroll-left {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .metal-icon {
      font-size: 1.2rem;
      color: #FFC107;
    }
  </style>
</head>
<body>

  <!-- ==================== GOLD RATES HEADER ==================== -->
  <div class="rates-header">
    <div class="ticker" id="ratesTicker">
      <!-- JS will inject live rates here -->
    </div>
  </div>

  <script>
    // Example API URL: replace with your real API
    const API_KEY = "c45bbc35b2742eacfc58e298bc1fd3b6"; // Your API key
const API_URL = "https://api.metalpriceapi.com/v1/latest";

    const metals = [
      { symbol: "XAU", name: "Gold", icon: "💰" },
      { symbol: "XAG", name: "Silver", icon: "⚪" },
      { symbol: "XPT", name: "Platinum", icon: "💎" }
    ];

    const ticker = document.getElementById("ratesTicker");

    async function fetchRates() {
      ticker.innerHTML = ""; // Clear previous rates

      for (let metal of metals) {
        try {
          // Fetch per ounce price
          const response = await fetch(`https://www.goldapi.io/api/${metal.symbol}/INR`, {
            headers: { "x-access-token": API_KEY, "Content-Type": "application/json" }
          });
          const data = await response.json();

          // Convert per ounce to per gram
          const perGram = data.price / 31.1035;
          const formattedRate = perGram.toFixed(2);

          // Create ticker item
          const item = document.createElement("div");
          item.className = "ticker-item";
          item.innerHTML = `<span class="metal-icon">${metal.icon}</span> ${metal.name}: ₹${formattedRate}/g`;
          ticker.appendChild(item);

        } catch (err) {
          console.error("Failed to fetch rate for " + metal.name, err);
        }
      }
    }

    fetchRates();
    // Refresh every 60 seconds
    setInterval(fetchRates, 60000);
  </script>
</body>
</html>
