<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Loans Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/static/admin-style.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="/static/images/logo.png" alt="SafeGold" height="30" class="me-2">
      SafeGold Admin
    </a>
    <div class="d-flex">
      <a class="btn btn-outline-light" th:href="@{/admin/logout}">
        <i class="fas fa-sign-out-alt me-1"></i>Logout
      </a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">
      <i class="fas fa-money-bill-wave me-2 text-primary"></i>Loans Management
    </h3>
    <div>
      <a class="btn btn-outline-secondary me-2" th:href="@{/admin/dashboard}">
        <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
      </a>
      <a class="btn btn-primary" th:href="@{/admin/loans/new}">
        <i class="fas fa-plus me-1"></i>New Loan
      </a>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table admin-table table-hover">
      <thead>
        <tr>
          <th><i class="fas fa-hashtag me-1"></i>ID</th>
          <th><i class="fas fa-user me-1"></i>User</th>
          <th><i class="fas fa-rupee-sign me-1"></i>Amount</th>
          <th><i class="fas fa-percentage me-1"></i>Interest</th>
          <th><i class="fas fa-calendar me-1"></i>Tenure</th>
          <th><i class="fas fa-gem me-1"></i>Gold Description</th>
          <th><i class="fas fa-info-circle me-1"></i>Status</th>
          <th><i class="fas fa-calendar-alt me-1"></i>Start Date</th>
          <th><i class="fas fa-cogs me-1"></i>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="l : ${loans}">
          <td th:text="${l.id}"></td>
          <td>
            <div>
              <strong th:text="${l.user != null ? l.user.name : 'N/A'}"></strong>
              <br>
              <small class="text-muted" th:text="${l.user != null ? l.user.email : 'N/A'}"></small>
            </div>
          </td>
          <td>
            <strong class="text-success">₹<span th:text="${#numbers.formatDecimal(l.amount, 1, 2)}"></span></strong>
          </td>
          <td>
            <span class="badge bg-info" th:text="${l.interestRate} + '%'"></span>
          </td>
          <td>
            <span th:text="${l.tenure} + ' months'"></span>
          </td>
          <td>
            <span th:text="${l.goldDescription != null ? l.goldDescription : 'N/A'}" 
                  th:title="${l.goldDescription != null ? l.goldDescription : 'N/A'}"
                  style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;"></span>
          </td>
          <td>
            <form th:action="@{'/admin/loans/' + ${l.id} + '/status'}" method="post" class="d-inline">
              <select class="form-select form-select-sm" name="status" onchange="this.form.submit()" style="min-width: 100px;">
                <option th:selected="${l.status == 'Active'}" value="Active">
                  <span class="badge bg-success">Active</span>
                </option>
                <option th:selected="${l.status == 'Closed'}" value="Closed">
                  <span class="badge bg-secondary">Closed</span>
                </option>
              </select>
            </form>
          </td>
          <td th:text="${#temporals.format(l.startDate, 'dd MMM yyyy')}"></td>
          <td>
            <div class="btn-group" role="group">
              <button class="btn btn-sm btn-outline-info" title="View Details">
                <i class="fas fa-eye"></i>
              </button>
              <button class="btn btn-sm btn-outline-warning" title="Edit Loan">
                <i class="fas fa-edit"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Add some interactive functionality
document.addEventListener('DOMContentLoaded', function() {
    // Add hover effects to table rows
    const tableRows = document.querySelectorAll('.admin-table tbody tr');
    tableRows.forEach(row => {
        row.addEventListener('mouseenter', function() {
            this.style.backgroundColor = '#f8f9ff';
        });
        row.addEventListener('mouseleave', function() {
            this.style.backgroundColor = '';
        });
    });
    
    // Add loading state to status update forms
    const statusForms = document.querySelectorAll('form[action*="/status"]');
    statusForms.forEach(form => {
        form.addEventListener('submit', function() {
            const submitBtn = this.querySelector('select');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.6';
            }
        });
    });
});
</script>

</body>
</html>
