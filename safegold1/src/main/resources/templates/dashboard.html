<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Body Gradient Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e3f2fd, #cfe0fc);
            min-height: 100vh;
            color: #343a40;
        }

        /* Back Button */
        .btn-back {
            border-radius: 8px;
            font-weight: 500;
        }

        /* Profile Section */
        .profile-section {
            display: flex;
            align-items: center;
            margin-bottom: 50px;
        }
        .profile-section .position-relative {
            display: inline-block;
        }
        .profile-img {
            border: 4px solid #0d6efd;
            transition: transform 0.4s, box-shadow 0.4s;
            width: 70px;
            height: 70px;
        }
        .profile-img:hover {
            transform: scale(1.15);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .upload-btn {
            position: absolute;
            bottom: -5px;
            right: -5px;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 50%;
            cursor: pointer;
            background-color: #0d6efd;
            color: #fff;
            border: none;
            transition: background-color 0.3s;
        }
        .upload-btn:hover {
            background-color: #0b5ed7;
        }

        /* Dashboard Cards */
        .card-hover {
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            padding: 2rem 1.5rem;
            text-align: center;
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
        .card-hover:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
        }
        .card-hover h5 {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .card-hover p {
            margin: 0;
            color: #6c757d;
        }

        /* Watchlist Badge */
        .badge-watchlist {
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Buttons */
        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
            font-weight: 500;
        }
        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }

        /* Modals */
        .modal-header {
            background-color: #0d6efd;
            color: #fff;
            font-weight: 600;
        }
        .modal-header .btn-close {
            filter: invert(1);
        }

        /* Tables */
        .table thead th {
            background-color: #0d6efd;
            color: #fff;
            font-weight: 600;
        }
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: #f1f5f9;
        }
        .table-hover > tbody > tr:hover {
            background-color: #e9ecef;
            cursor: pointer;
        }
        .table-bordered th,
        .table-bordered td {
            border: 1px solid #dee2e6;
        }
        .dataTables_wrapper .dataTables_filter input {
            border-radius: 6px;
            border: 1px solid #ced4da;
            padding: 4px 10px;
            height: 36px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card-hover {
                padding: 1.5rem 1rem;
            }
            .profile-section img {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body class="container mt-5">

    <!-- Back Button -->
    <a href="/" class="btn btn-outline-primary mb-3 btn-back"><i class="bi bi-arrow-left"></i> Back</a>

    <!-- Profile Section -->
    <div class="profile-section">
        <div class="position-relative">
            <img th:src="${user.profileImage}" class="rounded-circle profile-img" alt="Profile">
            <form th:action="@{/users/uploadPhoto}" method="post" enctype="multipart/form-data">
                <input type="file" name="profileImage" id="profileImageInput" accept="image/*" style="display:none;" onchange="this.form.submit()">
                <button type="button" class="upload-btn">✎</button>
            </form>
        </div>
        <div class="ms-3">
            <h3>Welcome, <span th:text="${user.name}">User Name</span></h3>
            <p class="text-muted">Here’s a quick overview of your account</p>
        </div>
    </div>

    <!-- Dashboard Cards -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card card-hover" data-bs-toggle="modal" data-bs-target="#activeLoansModal">
                <h5>Active Loans</h5>
                <p class="text-muted mb-0">Click to view details</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-hover" data-bs-toggle="modal" data-bs-target="#pastLoansModal">
                <h5>Past Loans</h5>
                <p class="text-muted mb-0">Click to view details</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-hover" data-bs-toggle="modal" data-bs-target="#paymentsModal">
                <h5>Payment History</h5>
                <a href="/dashboard/download/pdf" class="btn btn-sm btn-warning mt-2">Download PDF</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-hover" onclick="window.location.href='/users/watchlist'">
                <h5>My Watchlist</h5>
                <span class="badge bg-primary badge-watchlist" th:text="${watchlistCount}">0</span>
                <p class="text-muted mb-0">Click to view saved items</p>
            </div>
        </div>
    </div>

    <a href="/users/logout" class="btn btn-secondary mt-3">Logout</a>

    <!-- Active Loans Modal -->
    <div class="modal fade" id="activeLoansModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Active Loans</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <a href="/dashboard/download/pdf" class="btn btn-warning">Download PDF</a>
                    </div>
                    <div class="table-responsive">
                        <table id="activeLoansTable" class="table table-striped table-hover table-bordered align-middle">
                            <thead>
                                <tr>
                                    <th>Loan ID</th>
                                    <th>Amount</th>
                                    <th>Gold</th>
                                    <th>Interest</th>
                                    <th>Tenure</th>
                                    <th>Status</th>
                                    <th>Start Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                <th:block th:each="loan : ${user.loans}">
                                    <tr th:if="${loan.status?.trim() == 'Active'}">
                                        <td th:text="${loan.id}"></td>
                                        <td th:text="${loan.amount}"></td>
                                        <td th:text="${loan.goldDescription}"></td>
                                        <td th:text="${loan.interestRate} + '%'"></td>
                                        <td th:text="${loan.tenure}"></td>
                                        <td th:text="${loan.status}"></td>
                                        <td th:text="${loan.startDate}"></td>
                                    </tr>
                                </th:block>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
        // DataTables Init
        $(document).ready(function() {
            $('#activeLoansTable').DataTable({ "lengthMenu": [5, 10, 20] });
            $('#pastLoansTable').DataTable({ "lengthMenu": [5, 10, 20] });
            $('#paymentsTable').DataTable({ "lengthMenu": [5, 10, 20] });
        });

        // Profile Upload Button
        document.querySelector('.upload-btn').addEventListener('click', function() {
            document.getElementById('profileImageInput').click();
        });
    </script>
</body>
</html>
