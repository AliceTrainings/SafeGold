<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="stylesheet" href="/admin-style.css"/>
</head>
<body>
<div class="admin-login-bg d-flex justify-content-center align-items-center vh-100">
    <div class="card admin-card shadow p-4">
        <h2 class="text-center mb-4 fw-bold">Admin Login</h2>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3 position-relative">
                <input type="email" name="email" class="form-control" th:value="${email}" placeholder="Email" required/>
                <i class="fa-solid fa-envelope admin-input-icon"></i>
            </div>
            <div class="mb-3 position-relative">
                <input type="password" name="password" class="form-control" placeholder="Password" required/>
                <i class="fa-solid fa-lock admin-input-icon"></i>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">Login</button>
        </form>

        <p class="text-center mt-3">
            <a th:href="@{/users/login}" class="text-decoration-none">User login</a>
        </p>
    </div>
</div>
</body>
</html>
