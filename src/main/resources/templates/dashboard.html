<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2>Welcome, <span th:text="${user.name}">User</span></h2>

    <!-- Loans -->
    <h4 class="mt-4">Your Loans</h4>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Loan ID</th>
            <th>Amount</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="loan : ${userLoans}">
            <td th:text="${loan.id}">1</td>
            <td th:text="${loan.amount}">5000</td>
            <td th:text="${loan.status}">Active</td>
        </tr>
        <tr th:if="${userLoans == null or #lists.isEmpty(userLoans)}">
            <td colspan="3" class="text-center">No loans found.</td>
        </tr>
        </tbody>
    </table>

    <!-- Pending Payments -->
    <h4 class="mt-4">Pending Payments</h4>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Payment ID</th>
            <th>Loan ID</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Due Date</th>
            <th>Receipt</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="payment : ${reminders}" th:if="${reminders != null and !#lists.isEmpty(reminders)}">
            <td th:text="${payment.id}">1</td>
            <td th:text="${payment.loan.id}">1</td>
            <td th:text="${payment.amount}">500</td>
            <td th:text="${payment.status}">Pending</td>
            <td th:text="${payment.dueDate}">2025-10-01</td>
            <td>
                <a th:href="@{'/dashboard/loan/receipt/' + ${payment.id}}" class="btn btn-sm btn-primary"
                   th:if="${payment.status == 'Paid'}">View Receipt</a>
                <span th:if="${payment.status == 'Pending'}">-</span>
            </td>
        </tr>
        <tr th:if="${reminders == null or #lists.isEmpty(reminders)}">
            <td colspan="6" class="text-center">No pending payments.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
