<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Send OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
            <h2 class="text-center mb-4">Enter Mobile Number</h2>
            <form th:action="@{/users/send-otp}" method="post">
                <div class="mb-3">
                    <input
                        type="text"
                        class="form-control"
                        name="phone"
                        placeholder="+911234567890"
                        pattern="^\+\d{10,15}$"
                        title="Enter a valid number like +911234567890"
                        required
                    />
                </div>
                <button type="submit" class="btn btn-primary w-100">Send OTP</button>
            </form>
            <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success mt-3" th:text="${message}"></div>
        </div>
    </div>
</body>
</html>
